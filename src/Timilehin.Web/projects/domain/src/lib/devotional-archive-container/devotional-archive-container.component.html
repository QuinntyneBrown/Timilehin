@if (loading()) {
  <div class="loading-indicator" aria-label="Loading devotional archive">
    <span class="spinner"></span>
    <p>Loading devotionals...</p>
  </div>
} @else if (error()) {
  <div class="error-message" role="alert">
    <p>{{ error() }}</p>
  </div>
} @else {
  <div class="archive-list">
    @for (devotional of devotionals(); track devotional.id) {
      <gw-devotional-summary-card
        [date]="devotional.date"
        [title]="devotional.title"
        [excerpt]="devotional.excerpt"
        [scriptureReference]="devotional.scriptureReference"
        (cardClicked)="onCardClicked(devotional.id)"
      />
    }
  </div>

  @if (hasNextPage()) {
    <div class="load-more-container">
      <button class="load-more-button" (click)="loadMore()" [disabled]="loadingMore()">
        @if (loadingMore()) {
          <span class="spinner"></span> Loading...
        } @else {
          Load More
        }
      </button>
    </div>
  }
}
